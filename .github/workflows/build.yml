
name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.h'
      - '**.txt'
      - '**.yml'
      - '**.yaml'
      - 'CMakePresets.json'

permissions:
  contents: read

jobs:
  build:
    name: Compile VST3 (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Check out plugin project
        uses: actions/checkout@v5

      - name: Check out JUCE
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: JUCE

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build VST3
        run: cmake --build build --config Release --target IndependentMusicPlugin_VST3 --parallel

      - name: Upload VST3 build artifact
        uses: actions/upload-artifact@v6
        with:
          name: IndependentMusicPlugin-Windows-x64-VST3
          path: build/IndependentMusicPlugin_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 14
